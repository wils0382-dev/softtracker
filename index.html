  { id: 'w_breathwork',  label: 'Breathwork — 5 days',            domain: 'mind',     target: 5, unit: 'days',      dailyRule: 'breathwork' },
  { id: 'w_reframe',     label: 'Reframe negative thought — 2 days', domain: 'mind',  target: 2, unit: 'days',      dailyRule: 'reframe'    },
  { id: 'w_clarity',     label: 'Strategic clarity session',       domain: 'mind',     target: 1, unit: 'session',   dailyRule: null         },

  { id: 'w_finaction',   label: 'One meaningful financial action', domain: 'finance',  target: 1, unit: 'action',    dailyRule: null         },

const ALL_RULES = DOMAINS.flatMap(d => d.rules.map(r => ({ ...r, domain: d.id })));
const TOTAL_RULES = ALL_RULES.length;

// ── STATE ─────────────────────────────────────────────────────
let currentUser = null;
let state = defaultState();
let saveTimer = null;
let viewingDay = null; // null = today

function defaultState() {
  return { days: {}, weeks: {}, streak: 0, bestStreak: 0 };
}

// ── WEEK HELPERS ──────────────────────────────────────────
function getWeekKey(dateKey) {
  // Returns the Monday ISO date for the week containing dateKey
  const d = dateKey ? dateFromKey(dateKey) : new Date();
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1 - day);
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  return keyForDate(mon);
}

function currentWeekKey() {
  return getWeekKey(todayKey());
}

function getWeekData(weekKey) {
  if (!state.weeks[weekKey]) {
    state.weeks[weekKey] = { checks: {}, spendNotes: '', finActionNotes: '', clarityNotes: '' };
  }
  return state.weeks[weekKey];
}

// Count how many days in this week a daily rule was ticked
function countDailyRuleForWeek(weekKey, dailyRuleId) {
  let count = 0;
  const mon = dateFromKey(weekKey);
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    const dayKey = keyForDate(d);
    if (state.days[dayKey]?.checks?.[dailyRuleId]) count++;
  }
  return count;
}

// Weekly score = targets met / total targets
function weeklyScore(weekKey) {
  const wdata = state.weeks[weekKey];
  let met = 0;
  WEEKLY_TARGETS.forEach(t => {
    const progress = t.dailyRule
      ? countDailyRuleForWeek(weekKey, t.dailyRule)
      : (wdata?.checks?.[t.id] ? 1 : 0);
    if (progress >= t.target) met++;
  });
  return Math.round(met / WEEKLY_TARGETS.length * 100);
}

// ── FIREBASE ──────────────────────────────────────────────────
async function syncUp() {
  if (!currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      setSyncStatus('saving');
      await setDoc(
        doc(db, 'soft75', currentUser.uid, 'data', 'state'),
        { ...JSON.parse(JSON.stringify(state)), updatedAt: serverTimestamp() }
      );
      setSyncStatus('synced');
      // local backup
      localStorage.setItem('soft75_state', JSON.stringify(state));
    } catch(e) {
      setSyncStatus('offline');
    }
  }, 1200);
}

async function syncDown() {
  if (!currentUser) return;
  setSyncStatus('loading');
  try {
    const snap = await getDoc(doc(db, 'soft75', currentUser.uid, 'data', 'state'));
    if (snap.exists()) {
      const d = snap.data(); delete d.updatedAt;
      state = { ...defaultState(), ...d };
    }
    setSyncStatus('synced');
  } catch {
    setSyncStatus('offline');
    try {
      const local = localStorage.getItem('soft75_state');
      if (local) state = JSON.parse(local);
    } catch {}
  }
}

function setSyncStatus(s) {
  const el = document.getElementById('sync-dot');
  if (!el) return;
  const map = { synced: '#7a9e7e', saving: '#b89a6e', loading: '#5b8fa8', offline: '#c47c7c' };
  const lbl = { synced: 'Synced', saving: 'Saving…', loading: 'Loading…', offline: 'Offline' };
  el.style.background = map[s] || map.synced;
  el.title = lbl[s] || '';
}

function saveState() {
  localStorage.setItem('soft75_state', JSON.stringify(state));
  syncUp();
}

// ── AUTH ──────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  currentUser = user;

// ── DATE HELPERS ──────────────────────────────────────────────
function todayKey() {
  return new Date().toISOString().split('T')[0];
}

function keyForDate(d) {
  return d.toISOString().split('T')[0];
}

function dateFromKey(key) {
  // parse YYYY-MM-DD as local date
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatKey(key) {
  const d = dateFromKey(key);
  return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function formatKeyShort(key) {
  const d = dateFromKey(key);
  return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
}

function activeKey() {
  return viewingDay || todayKey();
}

function getDayData(key) {
  if (!state.days[key]) state.days[key] = { checks: {}, notes: '', mood: 0, energy: 0, sleep: '', weight: '' };
  return state.days[key];
}

function scoreForKey(key) {
  const d = state.days[key];
  if (!d) return null;
  const checked = ALL_RULES.filter(r => d.checks[r.id]).length;
  return Math.round(checked / TOTAL_RULES * 100);
}

// ── STREAK CALC ───────────────────────────────────────────────
function recalcStreak() {
  const today = todayKey();
  let streak = 0;
  let d = new Date();
  while (true) {
    const key = keyForDate(d);
    const score = scoreForKey(key);
    if (score === null || score < 80) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  state.streak = streak;
  if (streak > (state.bestStreak || 0)) state.bestStreak = streak;
}

// ── ROLLING AVERAGES ──────────────────────────────────────────
function rollingAvg(days) {
  const scores = [];
  const d = new Date();
  for (let i = 0; i < days; i++) {
    const key = keyForDate(d);
    const s = scoreForKey(key);
    if (s !== null) scores.push(s);
    d.setDate(d.getDate() - 1);
  }
  if (!scores.length) return null;
  return Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
}

// ── RENDER ────────────────────────────────────────────────────
function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display  = 'none';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display  = 'block';
  renderAll();
}

function renderAll() {
  recalcStreak();
  renderHeader();
  renderNav();
  renderDay();
  renderWeekly();
}

function renderHeader() {
  const today  = todayKey();
  const score7 = rollingAvg(7);
  const score30= rollingAvg(30);
  const todayScore = scoreForKey(today);

  document.getElementById('h-streak').textContent    = state.streak || 0;
  document.getElementById('h-best').textContent      = state.bestStreak || 0;
  document.getElementById('h-7day').textContent      = score7  !== null ? score7  + '%' : '—';
  document.getElementById('h-30day').textContent     = score30 !== null ? score30 + '%' : '—';

  // Score ring
  const pct = todayScore || 0;
  const ring = document.getElementById('score-ring-fill');
  if (ring) {
    const circ = 2 * Math.PI * 36;
    ring.style.strokeDasharray  = circ;
    ring.style.strokeDashoffset = circ * (1 - pct / 100);
    ring.style.stroke = pct >= 80 ? '#7a9e7e' : pct >= 50 ? '#b89a6e' : '#8b8b9a';
  }

  document.getElementById('user-email').textContent = currentUser?.email || '';
}

function renderNav() {
  // Build last 7 days nav
  const nav = document.getElementById('day-nav');
  nav.innerHTML = '';
  const today = todayKey();
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key   = keyForDate(d);
    const score = scoreForKey(key);
    const isActive = (activeKey() === key);
    const isToday  = (key === today);

    const btn = document.createElement('button');
    btn.className = 'day-nav-btn' + (isActive ? ' active' : '');
    btn.onclick   = () => { viewingDay = isToday ? null : key; renderAll(); };

    const dayLabel = d.toLocaleDateString('en-AU', { weekday: 'short' }).slice(0, 2);
    const dayNum   = d.getDate();
    const scoreBar = score !== null ? `<div class="nav-score-bar"><div class="nav-score-fill" style="width:${score}%;background:${score>=80?'#7a9e7e':score>=50?'#b89a6e':'#8b8b9a'}"></div></div>` : '<div class="nav-score-bar"></div>';

    btn.innerHTML = `
      <div class="nav-day-label">${isToday ? 'Today' : dayLabel}</div>
      <div class="nav-day-num">${dayNum}</div>
      ${scoreBar}
      <div class="nav-day-score">${score !== null ? score + '%' : '·'}</div>
    `;
    nav.appendChild(btn);
  }
}

function renderDay() {
  const key  = activeKey();
  const data = getDayData(key);
  const score = scoreForKey(key);
  const isToday = key === todayKey();

  document.getElementById('day-title').textContent   = isToday ? 'Today' : formatKeyShort(key);
  document.getElementById('day-date').textContent    = formatKey(key);
  document.getElementById('day-score-val').textContent = score !== null ? score + '%' : '0%';

  // Score label
  const lbl = document.getElementById('day-score-label');
  if (score >= 90)       { lbl.textContent = 'Exceptional'; lbl.style.color = '#7a9e7e'; }
  else if (score >= 80)  { lbl.textContent = 'Strong day';  lbl.style.color = '#7a9e7e'; }
  else if (score >= 60)  { lbl.textContent = 'Decent day';  lbl.style.color = '#b89a6e'; }
  else if (score >= 40)  { lbl.textContent = 'Below par';   lbl.style.color = '#b89a6e'; }
  else if (score !== null){ lbl.textContent = 'Needs work';  lbl.style.color = '#c47c7c'; }
  else                   { lbl.textContent = 'Not started'; lbl.style.color = '#5a5a6e'; }

  // Render domains
  const container = document.getElementById('domains-container');
  container.innerHTML = '';

  DOMAINS.forEach(domain => {
    const domainRules = domain.rules;
    const checkedCount = domainRules.filter(r => data.checks[r.id]).length;
    const domainPct = Math.round(checkedCount / domainRules.length * 100);

    const section = document.createElement('div');
    section.className = 'domain-section';

    section.innerHTML = `
      <div class="domain-header">
        <div class="domain-left">
          <div class="domain-indicator" style="background:${domain.color}"></div>
          <div class="domain-name">${domain.label}</div>
        </div>
        <div class="domain-score" style="color:${domain.color}">${checkedCount}/${domainRules.length}</div>
      </div>
      <div class="domain-progress">
        <div class="domain-progress-fill" style="width:${domainPct}%;background:${domain.color}"></div>
      </div>
      <div class="domain-rules" id="rules-${domain.id}"></div>
    `;

    container.appendChild(section);

    const rulesEl = section.querySelector(`#rules-${domain.id}`);
    domainRules.forEach(rule => {
      const checked = !!data.checks[rule.id];
      const row = document.createElement('div');
      row.className = 'rule-row' + (checked ? ' checked' : '');
      row.innerHTML = `
        <div class="rule-check">${checked ? '✓' : ''}</div>
        <div class="rule-label">${rule.label}</div>
      `;
      row.onclick = () => toggleRule(key, rule.id);
      rulesEl.appendChild(row);
    });
  });

  // Notes / reflections
  document.getElementById('notes-field').value  = data.notes  || '';
  document.getElementById('sleep-field').value  = data.sleep  || '';
  document.getElementById('weight-field').value = data.weight || '';
  renderMood(data.mood   || 0, 'mood-row',   'mood');
  renderMood(data.energy || 0, 'energy-row', 'energy');
}

function toggleRule(key, ruleId) {
  const data = getDayData(key);
  data.checks[ruleId] = !data.checks[ruleId];
  recalcStreak();
  saveState();
  renderAll();
}

function renderMood(val, rowId, field) {
  const row = document.getElementById(rowId);
  if (!row) return;
  row.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const dot = document.createElement('button');
    dot.className = 'mood-dot' + (i <= val ? ' active' : '');
    dot.onclick = () => {
      const key = activeKey();
      getDayData(key)[field] = i;
      saveState();
      renderMood(i, rowId, field);
    };
    row.appendChild(dot);
  }
}

window.saveNotes = function() {
  const key  = activeKey();
  const data = getDayData(key);
  data.notes  = document.getElementById('notes-field').value;
  data.sleep  = document.getElementById('sleep-field').value;
  data.weight = document.getElementById('weight-field').value;
  saveState();
};

// ── HISTORY PANEL ─────────────────────────────────────────────
window.showHistory = function() {
  const panel = document.getElementById('history-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) renderHistory();
};

function renderHistory() {
  const list = document.getElementById('history-list');
  const keys = Object.keys(state.days).sort().reverse();
  if (!keys.length) { list.innerHTML = '<p class="empty">No days logged yet.</p>'; return; }

  list.innerHTML = keys.slice(0, 60).map(key => {
    const score = scoreForKey(key);
    const color = score >= 80 ? '#7a9e7e' : score >= 50 ? '#b89a6e' : '#c47c7c';
    return `
      <div class="history-row" onclick="jumpToDay('${key}')">
        <div class="history-date">${formatKeyShort(key)}</div>
        <div class="history-bar-wrap">
          <div class="history-bar-fill" style="width:${score}%;background:${color}"></div>
        </div>
        <div class="history-score" style="color:${color}">${score}%</div>
      </div>`;
  }).join('');
}

window.jumpToDay = function(key) {
  viewingDay = key === todayKey() ? null : key;
  document.getElementById('history-panel').classList.remove('open');
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

// ── SETTINGS PANEL ────────────────────────────────────────────
window.showSettings = function() {
  document.getElementById('settings-panel').classList.toggle('open');
};

window.exportData = function() {
  const blob = new Blob([JSON.stringify({ exportDate: new Date().toISOString(), state }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '75soft-backup-' + todayKey() + '.json';
  a.click();
  toast('Backup exported.');
};

window.importData = function(e) {
  const file = e.target.files[0];
  if (!file || !confirm('This will overwrite all current data.')) return;
  const r = new FileReader();
  r.onload = async ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.state) { state = d.state; saveState(); renderAll(); toast('Backup imported.'); }
    } catch { toast('Import failed.'); }
  };
  r.readAsText(file);
};

window.clearData = async function() {
  if (!confirm('Delete all data? This cannot be undone.')) return;
  state = defaultState();
  saveState();
  renderAll();
  toast('All data cleared.');
};

// ── WEEKLY RENDER ────────────────────────────────────────
function renderWeekly() {
  const weekKey = currentWeekKey();
  const wdata   = getWeekData(weekKey);
  const mon     = dateFromKey(weekKey);
  const sun     = new Date(mon); sun.setDate(mon.getDate() + 6);
  const weekLabel = mon.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })
    + ' – ' + sun.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });

  const container = document.getElementById('weekly-container');
  if (!container) return;

  // Group targets by domain
  const byDomain = {};
  WEEKLY_TARGETS.forEach(t => {
    if (!byDomain[t.domain]) byDomain[t.domain] = [];
    byDomain[t.domain].push(t);
  });

  const domainColors = {};
  DOMAINS.forEach(d => { domainColors[d.id] = d.color; });
  const domainLabels = {};
  DOMAINS.forEach(d => { domainLabels[d.id] = d.label; });

  let html = `<div class="weekly-header">
    <div class="weekly-title">This week</div>
    <div class="weekly-dates">${weekLabel}</div>
    <div class="weekly-score-val">${weeklyScore(weekKey)}% of weekly targets met</div>
  </div>`;

  Object.entries(byDomain).forEach(([domainId, targets]) => {
    const color = domainColors[domainId] || '#8a8a9e';
    const label = domainLabels[domainId] || domainId;
    html += `<div class="weekly-domain-section">
      <div class="weekly-domain-label" style="color:${color}">${label}</div>`;

    targets.forEach(t => {
      const progress = t.dailyRule
        ? countDailyRuleForWeek(weekKey, t.dailyRule)
        : (wdata.checks[t.id] ? 1 : 0);
      const met  = progress >= t.target;
      const pct  = Math.min(100, Math.round(progress / t.target * 100));

      // For non-daily-linked targets show a manual checkbox
      const isManual = !t.dailyRule;

      html += `<div class="weekly-target-row">
        <div class="weekly-target-left">
          ${isManual ? `<div class="rule-check weekly-check ${met ? 'checked' : ''}" onclick="toggleWeeklyCheck('${weekKey}','${t.id}')">${met ? '✓' : ''}</div>` : `<div class="weekly-auto-indicator" style="background:${met ? color : 'var(--surface3)'}"></div>`}
          <div class="weekly-target-label">${t.label}</div>
        </div>
        <div class="weekly-target-right">
          <div class="weekly-progress-wrap">
            <div class="weekly-progress-fill" style="width:${pct}%;background:${color}"></div>
          </div>
          <div class="weekly-progress-text" style="color:${met ? color : 'var(--text3)'}">${progress}/${t.target}</div>
        </div>
      </div>`;

      // Special notes fields for manual financial targets
      if (t.id === 'w_finaction') {
        html += `<div class="weekly-notes-wrap">
          <input type="text" class="weekly-notes-input" placeholder="What was your financial action this week?" 
            value="${(wdata.finActionNotes||'').replace(/"/g,'&quot;')}"
            onchange="saveWeeklyNotes('${weekKey}','finActionNotes',this.value)">
        </div>`;
      }
      if (t.id === 'w_clarity') {
        html += `<div class="weekly-notes-wrap">
          <input type="text" class="weekly-notes-input" placeholder="What did your clarity session focus on?"
            value="${(wdata.clarityNotes||'').replace(/"/g,'&quot;')}"
            onchange="saveWeeklyNotes('${weekKey}','clarityNotes',this.value)">
        </div>`;
      }
    });

    html += `</div>`;
  });

  // Spend justification notes
  html += `<div class="weekly-domain-section">
    <div class="weekly-domain-label" style="color:#8fa87a">Spending log</div>
    <textarea class="weekly-notes-input" style="min-height:70px" 
      placeholder="Record any non-essential spending and your justification..."
      onchange="saveWeeklyNotes('${weekKey}','spendNotes',this.value)">${wdata.spendNotes||''}</textarea>
  </div>`;

  container.innerHTML = html;
}

window.toggleWeeklyCheck = function(weekKey, targetId) {
  const wdata = getWeekData(weekKey);
  wdata.checks[targetId] = !wdata.checks[targetId];
  saveState();
  renderWeekly();
  renderHeader();
};

window.saveWeeklyNotes = function(weekKey, field, value) {
  getWeekData(weekKey)[field] = value;
  saveState();
};

// ── TOAST ──────────────────────────────────────────────────────
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}
</script>

<style>
:root {
  --bg:      #0e0e12;
  --surface: #14141a;
  --surface2:#1a1a22;
  --surface3:#20202a;
  --border:  #2a2a38;
  --border2: #353548;
  --text:    #d8d8e8;
  --text2:   #8a8a9e;
  --text3:   #5a5a6e;
  --teal:    #5b8fa8;
  --sage:    #7a9e7e;
  --gold:    #b89a6e;
  --lavender:#8b7eb8;
  --rose:    #c47c7c;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.5;
}

/* ── LOGIN ───────────────────────────────────────────────── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-wrap {
  width: 100%;
  max-width: 360px;
}

.login-title {
  font-family: 'DM Serif Display', serif;
  font-size: 36px;
  color: var(--text);
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}

.login-title em {
  font-style: italic;
  color: var(--text2);
}

.login-sub {
  font-size: 13px;
  color: var(--text3);
  margin-bottom: 32px;
}

.field-label {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 6px;
  margin-top: 16px;
  letter-spacing: 0.3px;
}

input[type=email], input[type=password], input[type=text],
input[type=number], textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, textarea:focus { border-color: var(--teal); }
textarea { resize: vertical; min-height: 80px; }

.btn-primary {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary:hover { border-color: var(--teal); color: var(--teal); }

.login-error { font-size: 12px; color: var(--rose); margin-top: 8px; min-height: 18px; }

/* ── APP SCREEN ──────────────────────────────────────────── */
#app-screen { display: none; }

/* ── TOP BAR ─────────────────────────────────────────────── */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(14,14,18,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}

.top-bar-left { display: flex; align-items: center; gap: 12px; }

.app-wordmark {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  letter-spacing: -0.3px;
}

.app-wordmark em { font-style: italic; color: var(--text2); }

.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--sage);
  transition: background 0.3s;
}

.top-bar-right { display: flex; align-items: center; gap: 12px; }

#user-email {
  font-size: 11px;
  color: var(--text3);
  font-family: 'DM Mono', monospace;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--text2);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 8px;
  border-radius: 6px;
  transition: color 0.2s;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
}
.icon-btn:hover { color: var(--text); }

/* ── STATS ROW ───────────────────────────────────────────── */
.stats-row {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 24px;
  padding: 24px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}

/* Score ring */
.score-ring-wrap { position: relative; width: 88px; height: 88px; flex-shrink: 0; }
.score-ring-wrap svg { transform: rotate(-90deg); }
.score-ring-bg { fill: none; stroke: var(--surface3); stroke-width: 5; }
.score-ring-fill {
  fill: none;
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s ease, stroke 0.3s;
}
.score-ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#day-score-val {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  line-height: 1;
  color: var(--text);
}
#day-score-label { font-size: 9px; color: var(--text3); margin-top: 2px; letter-spacing: 0.3px; }

/* Stat chips */
.stat-chips { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.stat-chip { }
.stat-chip-val {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  line-height: 1;
  color: var(--text);
}
.stat-chip-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }

.stat-divider { width: 1px; height: 40px; background: var(--border); align-self: center; }

/* ── DAY NAV ─────────────────────────────────────────────── */
.day-nav-wrap {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.day-nav-wrap::-webkit-scrollbar { display: none; }

#day-nav { display: flex; gap: 8px; }

.day-nav-btn {
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  color: var(--text2);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  transition: all 0.15s;
  min-width: 64px;
  text-align: center;
}
.day-nav-btn:hover { border-color: var(--border2); color: var(--text); }
.day-nav-btn.active { border-color: var(--teal); color: var(--text); background: var(--surface2); }

.nav-day-label { font-size: 10px; color: var(--text3); margin-bottom: 3px; }
.nav-day-num { font-family: 'DM Serif Display', serif; font-size: 18px; line-height: 1; margin-bottom: 6px; }
.nav-score-bar { height: 3px; background: var(--surface3); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
.nav-score-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.nav-day-score { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; }

/* ── MAIN CONTENT ────────────────────────────────────────── */
.main-content { max-width: 680px; margin: 0 auto; padding: 24px 20px 60px; }

.day-heading { margin-bottom: 24px; }
#day-title {
  font-family: 'DM Serif Display', serif;
  font-size: 32px;
  letter-spacing: -0.5px;
  line-height: 1;
  margin-bottom: 4px;
}
#day-date { font-size: 13px; color: var(--text3); }

/* ── DOMAINS ─────────────────────────────────────────────── */
.domain-section {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 10px;
  background: var(--surface);
}

.domain-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.domain-left { display: flex; align-items: center; gap: 8px; }

.domain-indicator {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.domain-name { font-size: 13px; font-weight: 500; color: var(--text2); }
.domain-score { font-family: 'DM Mono', monospace; font-size: 12px; }

.domain-progress {
  height: 2px;
  background: var(--surface3);
  border-radius: 1px;
  overflow: hidden;
  margin-bottom: 12px;
}
.domain-progress-fill { height: 100%; border-radius: 1px; transition: width 0.4s; }

/* Rules */
.rule-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  cursor: pointer;
  transition: opacity 0.15s;
}
.rule-row:hover { opacity: 0.85; }

.rule-check {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--border2);
  border-radius: 4px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: #000;
  transition: all 0.15s;
}

.rule-row.checked .rule-check {
  background: var(--sage);
  border-color: var(--sage);
}

.rule-label { font-size: 13px; color: var(--text); line-height: 1.4; }
.rule-row.checked .rule-label { color: var(--text3); text-decoration: line-through; }

/* ── REFLECTION ──────────────────────────────────────────── */
.reflection-section {
  margin-top: 20px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  background: var(--surface);
}

.reflection-title {
  font-family: 'DM Serif Display', serif;
  font-size: 16px;
  color: var(--text2);
  margin-bottom: 14px;
  font-style: italic;
}

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.mood-row-wrap { margin-top: 14px; }
.mood-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.mood-row { display: flex; gap: 8px; }
.mood-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.5px solid var(--border2);
  background: none;
  cursor: pointer;
  transition: all 0.15s;
}
.mood-dot.active { background: var(--teal); border-color: var(--teal); }

/* ── HISTORY PANEL ───────────────────────────────────────── */
.slide-panel {
  position: fixed;
  right: 0; top: 0; bottom: 0;
  width: 320px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  padding: 24px;
  transform: translateX(100%);
  transition: transform 0.3s ease;
  z-index: 200;
  overflow-y: auto;
}
.slide-panel.open { transform: translateX(0); }

.panel-title {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  margin-bottom: 20px;
  color: var(--text2);
  font-style: italic;
}

.history-row {
  display: grid;
  grid-template-columns: 80px 1fr 40px;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  align-items: center;
  transition: opacity 0.15s;
}
.history-row:hover { opacity: 0.75; }
.history-date { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.history-bar-wrap { height: 3px; background: var(--surface3); border-radius: 2px; overflow: hidden; }
.history-bar-fill { height: 100%; border-radius: 2px; }
.history-score { font-size: 11px; font-family: 'DM Mono', monospace; text-align: right; }

.settings-section { margin-bottom: 20px; }
.settings-label { font-size: 11px; color: var(--text3); margin-bottom: 8px; }
.settings-btn {
  display: block;
  width: 100%;
  padding: 9px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text2);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  margin-bottom: 6px;
  transition: all 0.15s;
}
.settings-btn:hover { border-color: var(--border2); color: var(--text); }
.settings-btn.danger { color: var(--rose); }
.settings-btn.danger:hover { border-color: var(--rose); }

.empty { color: var(--text3); font-size: 13px; font-style: italic; }

/* ── TOAST ───────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 13px;
  color: var(--text2);
  z-index: 9000;
  animation: fadeToast 2.8s ease forwards;
  white-space: nowrap;
}
@keyframes fadeToast {
  0%   { opacity: 0; transform: translateX(-50%) translateY(8px); }
  15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
  80%  { opacity: 1; }
  100% { opacity: 0; }
}

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media (max-width: 500px) {
  .stats-row { grid-template-columns: 1fr; gap: 16px; }
  .score-ring-wrap { display: none; }
  .top-bar { padding: 12px 16px; }
  .main-content { padding: 16px 14px 60px; }
  .field-row { grid-template-columns: 1fr; }
  .slide-panel { width: 100%; }
}


/* ── WEEKLY TARGETS ──────────────────────────────────────── */
.weekly-header { margin-bottom: 16px; }
.weekly-title {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  font-style: italic;
  color: var(--text2);
  margin-bottom: 2px;
}
.weekly-dates { font-size: 12px; color: var(--text3); margin-bottom: 4px; }
.weekly-score-val { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }

.weekly-domain-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.weekly-domain-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.3px;
  margin-bottom: 10px;
  text-transform: uppercase;
  font-size: 10px;
}

.weekly-target-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 7px 0;
  border-top: 1px solid var(--border);
}
.weekly-target-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.weekly-target-label { font-size: 13px; color: var(--text); line-height: 1.3; }
.weekly-target-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.weekly-auto-indicator {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background 0.3s;
}

.weekly-check {
  cursor: pointer;
  flex-shrink: 0;
}

.weekly-progress-wrap {
  width: 60px; height: 3px;
  background: var(--surface3);
  border-radius: 2px;
  overflow: hidden;
}
.weekly-progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
.weekly-progress-text {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  min-width: 28px;
  text-align: right;
}

.weekly-notes-wrap { padding: 6px 0 4px 26px; }
.weekly-notes-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text2);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  padding: 7px 10px;
  outline: none;
  transition: border-color 0.2s;
  resize: vertical;
}
.weekly-notes-input:focus { border-color: var(--teal); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-title">75 <em>Soft</em></div>
    <div class="login-sub">Empowered Life Tracker</div>
    <label class="field-label">Email</label>
    <input type="email" id="l-email" placeholder="your@email.com" autocomplete="email"

  </div>
</div>

<!-- APP -->
<div id="app-screen">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="app-wordmark">75 <em>Soft</em></div>
      <div class="sync-dot" id="sync-dot" title="Synced"></div>
    </div>
    <div class="top-bar-right">
      <span id="user-email"></span>
      <button class="icon-btn" onclick="showHistory()">History</button>

    </div>
  </div>

  <!-- STATS ROW -->
  <div class="stats-row">
    <div class="score-ring-wrap">
      <svg width="88" height="88" viewBox="0 0 88 88">
        <circle class="score-ring-bg" cx="44" cy="44" r="36"/>
        <circle class="score-ring-fill" id="score-ring-fill" cx="44" cy="44" r="36"
          style="stroke-dasharray:226;stroke-dashoffset:226;stroke:#8b8b9a"/>
      </svg>
      <div class="score-ring-text">
        <div id="day-score-val">—</div>
        <div id="day-score-label">—</div>
      </div>
    </div>
    <div class="stat-chips">

      <div class="stat-divider"></div>
      <div class="stat-chip">
        <div class="stat-chip-val" id="h-best">0</div>
        <div class="stat-chip-lbl">Best streak</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-chip">
        <div class="stat-chip-val" id="h-7day">—</div>
        <div class="stat-chip-lbl">7-day avg</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-chip">
        <div class="stat-chip-val" id="h-30day">—</div>
        <div class="stat-chip-lbl">30-day avg</div>
      </div>
    </div>
  </div>

  <!-- DAY NAV -->
  <div class="day-nav-wrap">
    <div id="day-nav"></div>
  </div>

  <!-- MAIN -->
  <div class="main-content">

    <div class="day-heading">
      <div id="day-title">Today</div>
      <div id="day-date"></div>
    </div>

      <div class="reflection-title">End of day reflection</div>

</div>

<!-- HISTORY PANEL -->
<div id="history-panel" class="slide-panel">
  <div class="panel-title">History</div>
  <div id="history-list"></div>
</div>

<!-- SETTINGS PANEL -->
<div id="settings-panel" class="slide-panel">
  <div class="panel-title">Settings</div>
  <div class="settings-section">
    <div class="settings-label">Data</div>
    <button class="settings-btn" onclick="exportData()">Export backup (JSON)</button>
    <button class="settings-btn" onclick="document.getElementById('import-input').click()">Import backup</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
    <button class="settings-btn danger" onclick="clearData()">Clear all data</button>
  </div>
  <div class="settings-section">
    <div class="settings-label">Account</div>
    <button class="settings-btn" onclick="doSignOut()">Sign out</button>
  </div>
</div>

</body>
</html>
